<VirtualHost *:80>
    ServerName webgoat.local

    ProxyPreserveHost On
    ProxyPass /WebGoat http://127.0.0.1:8082/WebGoat
    ProxyPassReverse /WebGoat http://127.0.0.1:8082/WebGoat

    ProxyPass / http://127.0.0.1:8082/WebGoat/
    ProxyPassReverse / http://127.0.0.1:8082/WebGoat/


    ErrorLog ${APACHE_LOG_DIR}/webgoat.local-error.log
    CustomLog ${APACHE_LOG_DIR}/webgoat.local-access.log combined
</VirtualHost>
