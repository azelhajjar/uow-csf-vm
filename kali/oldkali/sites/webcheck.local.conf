<VirtualHost *:80>
    ServerName webcheck.local

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8084/
    ProxyPassReverse / http://127.0.0.1:8084/



    ErrorLog ${APACHE_LOG_DIR}/webcheck.local-error.log
    CustomLog ${APACHE_LOG_DIR}/webcheck.local-access.log combined
</VirtualHost>
