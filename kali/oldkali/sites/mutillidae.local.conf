<VirtualHost *:80>
    ServerName mutillidae.local

    ProxyPreserveHost On
    ProxyPass /WebGoat http://127.0.0.1:8085/mutillidae
    ProxyPassReverse /WebGoat http://127.0.0.1:8085/mutillidae

    ProxyPass / http://127.0.0.1:8085/mutillidae/
    ProxyPassReverse / http://127.0.0.1:8085/mutillidae/


    ErrorLog ${APACHE_LOG_DIR}/mutillidae.local-error.log
    CustomLog ${APACHE_LOG_DIR}/mutillidae.local-access.log combined
</VirtualHost>
