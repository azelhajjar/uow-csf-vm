[global]
   workgroup = WORKGROUP
   server string = CavNet SMB
   map to guest = Bad User
   usershare allow guests = yes
   log file = /var/log/samba/log.%m
   max log size = 1000

[public]
   path = /srv/samba/public
   browseable = yes
   guest ok = yes
   read only = no
   force user = nobody
   create mask = 0666
   directory mask = 0777